# Publishes the Moonlight registry (public/r) to GitHub Pages on every push to main, built with the Pages URL baked in, so
# consumers install from https://emonsaqibh.github.io/Moonlight-UI/r without running a local server.
name: Registry (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY_URL: https://emonsaqibh.github.io/Moonlight-UI/r
      MOONLIGHT_SKILL_INSTALL: "0" # no ~/.claude/skills copy on the runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run registry:build
      # serve only the registry, at /r, next to nothing else from public/
      - run: mkdir -p _site && cp -R public/r _site/r && touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
